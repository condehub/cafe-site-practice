<!DOCTYPE html>
<html>
  <head>
    <title>Conde Cafe Space</title>
    <link rel="stylesheet" href="main.css">
  </head>
  <body>
    <header>
      <span class="a_GcMg font-feature-liga-off font-feature-clig-off font-feature-calt-off text-decoration-none text-strikethrough-none" style="color: rgba(122,173,235,var(--O42jJQ,1)); caret-color: rgb(122, 173, 235); --Ys-XuQ: none; font-weight: 400; font-style: normal; font-kerning: none;">CondeCafe</span>
      <ul>
        <li>Início</li>
        <li>Explorar</li>
        <li>Sobre</li>
        <li>Contatos</li>
      </ul>
      <div class="cart-icon-container">
        <img src="assets/icons/basket.png" alt="Abrir pedido">
      </div>
    </header>
    <main>
      <h1>Bem-vindo, faça o seu pedido:</h1>
      <section class="cardapio-section">
      <button class="cardapio-button">Cardápio</button>
      <div class="cardapio-grid">
        <div class="cardapio-item">
          <div class="item-picture">
            <img src="assets/images/images.jpg" alt="Pão com ovo">
          </div>
          <div class="product-name" title="Pão com ovo">Pão com ovo</div>
          <div class="button-price-container">
            
            <div class="add-button-container">
              <button class="add-button">Adicionar</button>
            </div>
            <div class="product price">R$ 8</div>
          </div>
        </div>
        <div class="cardapio-item">
          <div class="item-picture">
            <img src="assets/images/images.jpg" alt="Pão com queijo, presunto, ovo e requeijão">
          </div>
          <div class="product-name" title="Pão com queijo, presunto, ovo e requeijão">Pão com queijo, presunto, ovo e requeijão</div>
          <div class="button-price-container">
            <div class="add-button-container">
              <button class="add-button">Adicionar</button>
            </div>
            <div class="product price">R$ 8</div>
          </div>
        </div>
        <div class="cardapio-item">
          <div class="item-picture">
            <img src="assets/images/images.jpg" alt="Pão com manteiga">
          </div>
          <div class="product-name" title="Pão com manteiga">Pão com manteiga</div>
          <div class="button-price-container">
            <div class="add-button-container">
              <button class="add-button">Adicionar</button>
            </div>
            <div class="product price">R$ 8</div>
          </div>
        </div>
        <div class="cardapio-item">
          <div class="item-picture">
            <img src="assets/images/images.jpg" alt="Tapioca com ovo, queijo e presunto">
          </div>
          <div class="product-name" title="Tapioca com ovo, queijo e presunto">Tapioca com ovo, queijo e presunto</div>
          <div class="button-price-container">
            <div class="add-button-container">
              <button class="add-button">Adicionar</button>
            </div>
            <div class="product price">R$ 8</div>
          </div>
        </div>
        <div class="cardapio-item">
          <div class="item-picture">
            <img src="assets/images/images.jpg" alt="Panqueca com mel e banana">
          </div>
          <div class="product-name" title="Panqueca com mel e banana">Panqueca com mel e banana</div>
          <div class="button-price-container">
            <div class="add-button-container">
              <button class="add-button">Adicionar</button>
            </div>
            <div class="product price">R$ 8</div>
          </div>
        </div>
        <div class="cardapio-item">
          <div class="item-picture">
            <img src="assets/images/images.jpg" alt="Café com leite">
          </div>
          <div class="product-name" title="Café com leite">Café com leite</div>
          <div class="button-price-container">
            <div class="add-button-container">
              <button class="add-button">Adicionar</button>
            </div>
            <div class="product price">R$ 8</div>
          </div>
        </div>
      </div>
    </section>
    </main>
  </body>
</html>
